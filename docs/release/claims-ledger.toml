# Every number the v0.1.0 paper and release notes state about a result, tied to the verified crate
# that carries it (Stage 21; operator decision D2, record-faithful wording).
# tests/unit/test_release_claims_ledger.py does three things for each claim:
#   1. re-reads the value from the crate, after `verify_crate`;
#   2. renders it with `format` (after `scale`) and requires exactly `text`;
#   3. requires `text` in every document listed in `in`.
# A value comes from one of:
#   - `result`: a JSON pointer into the crate's result.json;
#   - `gate` + `attr`: a gate's observed value or threshold, by "scope/name";
#   - `member` + `pointer`: a pointer into a crate member, such as embedded evidence.

paper = "paper/paper.md"
notes = "docs/release/RELEASE-NOTES-v0.1.0.md"

[[claim]]
id = "s12-cd"
crate = "stage12-oscillating-cylinder-lockin"
result = "/quantities/0/value"
format = "{:.3f}"
text = "1.993"
in = ["paper", "notes"]

