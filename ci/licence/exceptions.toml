# Reviewed, exact-version licence exceptions (ADR-048). Read by scripts/licence_scan.py.
#
# kind = "identify": the index metadata is missing, ambiguous or contradictory. The reviewer
#        establishes the licence from the upstream LICENSE at the released tag. The reviewed SPDX
#        expression must still pass the allowlist in every scope the package is reachable from.
#        An identify exception for metadata that already normalises is UNNEEDED, and fails.
# kind = "admit":    the licence is known and NOT on the allowlist. The package is admitted in the
#        listed scopes for the stated reason (ADR-048 decision D1).
#
# Every exception is keyed by exact name + version (+ commit for a git source). It FAILS the scan when
# the lock moves (stale), when it is unused, or when the package is reachable from a scope it does
# not list. Prepared by the Stage-21 agent from the upstream licence texts linked below, and reviewed
# and approved by the operator on 2026-10-14 (his sign-off comment on PR #57, the ADR-048
# ratification).

# --- base (dvc's transitive GPL-2 family; ADR-048 D1: dvc stays in the base dependencies) ---------

[[exception]]
package = "grandalf"
version = "0.8"
kind = "admit"
reviewed_spdx = "GPL-2.0-only OR EPL-1.0"
scopes = ["base", "supported-extras"]
reason = """Transitive runtime dependency of dvc (DAG rendering). aero never imports it and never \
redistributes it; the user's installer resolves it. Neither GPL-2.0-only nor EPL-1.0 is \
GPL-3.0-compatible, so it is admitted, not allowed. Re-review whenever dvc moves."""
adr = "ADR-048"
evidence = "https://github.com/bdcht/grandalf/blob/v0.8/LICENSE"
reviewer = "Louis Ernesto Schulte Moredo (operator), approved 2026-10-14 on PR #57; prepared by Claude Code (Stage 21 agent)"
date = "2026-10-12"

[[exception]]
package = "pygit2"
version = "1.19.2"
kind = "admit"
reviewed_spdx = "GPL-2.0-only WITH GCC-exception-2.0"
scopes = ["base", "supported-extras"]
reason = """Transitive runtime dependency of dvc via scmrepo. GPL-2.0 with the libgit2 linking \
exception ("unlimited permission to link the compiled version of this library into combinations \
with other programs"). aero never imports it and never redistributes it. Admitted, not allowed. \
Re-review whenever dvc or scmrepo moves."""
adr = "ADR-048"
evidence = "https://github.com/libgit2/pygit2/blob/v1.19.2/COPYING"
reviewer = "Louis Ernesto Schulte Moredo (operator), approved 2026-10-14 on PR #57; prepared by Claude Code (Stage 21 agent)"
date = "2026-10-12"

[[exception]]
package = "python-dateutil"
version = "2.9.0.post0"
kind = "identify"
reviewed_spdx = "Apache-2.0 AND BSD-3-Clause"
scopes = ["base", "supported-extras", "gpu-frozen"]
reason = """The License field says "Dual License" and two classifiers are set. The LICENSE \
puts contributions after 2017 under Apache-2.0 and states that the BSD-3-Clause licence applies \
to all code, so both apply. Both terms are on the allowlist."""
adr = "ADR-048"
evidence = "https://github.com/dateutil/dateutil/blob/2.9.0.post0/LICENSE"
reviewer = "Louis Ernesto Schulte Moredo (operator), approved 2026-10-14 on PR #57; prepared by Claude Code (Stage 21 agent)"
date = "2026-10-12"

