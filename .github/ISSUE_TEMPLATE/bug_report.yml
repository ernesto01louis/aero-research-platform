name: Bug report
description: "Something is wrong: a crash, a wrong number, a crate that does not verify."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A result is only debuggable if we can identify it exactly: give its
        **four-tuple**, or the **crate id + crate digest** (`python -I -B -m aero.crate show <crate>`
        prints both).
  - type: input
    id: version
    attributes:
      label: Platform version
      description: The release (e.g. v0.1.0) or the git commit you ran.
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Four-tuple, or crate id + digest
      description: "`git_sha`, `dvc_input_hash`, `container_sif_sha256`, `config_hash` - or the crate id and the sha256 of its SHA256SUMS. Write n/a only for a crash before any run."
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: The exact command, the full output or error, and what you expected instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, how you installed (uv sync / Release wheel), any extras.
    validations:
      required: true
