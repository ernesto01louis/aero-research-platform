name: vv-transonic

# V&V SU2 stack — runs every `su2`-marked V&V test (the Stage-06 transonic NACA 0012 and
# ONERA M6 cases, plus the TMR flat plate / NACA 0012 / 2D bump through SU2) on the
# self-hosted `vv` runner. The SU2 stack is FROZEN-OPTIONAL (ADR-013): the report shows its
# cases as `frozen` and gives the stack its own verdict, which never gates an OpenFOAM-stack
# production run (ADR-051 D2 (b)).
#
# DISPATCH ONLY since Stage 22 (operator decision 2026-10-16), the H-19 pattern applied to
# vv-scale-resolving. It used to run nightly and was green every night while measuring nothing:
# SU2_CFD died at startup ("solver failed (rc=1)"), the ONERA M6 test turned that into a SKIP and
# the transonic NACA 0012 test into an XFAIL, and the `dvc pull --quiet || echo "dvc pull skipped
# (no remote configured)"` step relabelled its own failure. Now the pull is targeted and fails
# loudly, a solver failure FAILS its test, and the step summary says what was measured.
#
# A GitHub-hosted runner cannot reach the private aero cluster, the SU2 SIF, the MLflow server,
# or the aero_provenance DB, so this job must run self-hosted. See ADR-006.

on:
  workflow_dispatch:

# REAP first, then the concurrency group (the order vv-smoke documents): the SU2 path
# submits through scripts/run_long.sh (aero/adapters/su2/solver.py), and the runner is
# configured `Force kill process on cancellation: False`, so without REAP a cancelled or
# timed-out job strands its detached solve. `cancel-in-progress: false` -- a nightly
# multi-hour run is never worth discarding for a newer trigger. (Stage 21, ADR-049 H-10;
# `pull-requests: write` dropped: no step comments on a PR.)
concurrency:
  group: vv-transonic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vv-transonic:
    name: V&V SU2 stack — SU2 v8 (frozen-optional, dispatch only)
    runs-on: [self-hosted, vv]
    timeout-minutes: 180
    env:
      # Secrets are STEP-scoped (Stage 21, ADR-049 H-08): only the steps that talk to
      # the cluster receive them -- never the install step, which runs third-party
      # build code, and never a third-party action.
      # This job owns the lifetime of every solve it submits: run_long.sh reaps the
      # detached tmux session on cancellation or timeout instead of leaving it running.
      AERO_RUN_LONG_REAP: "1"
      # Stage 22 (ADR-051): a cluster that is not ready FAILS the suite instead of skipping it.
      AERO_VV_REQUIRE_CLUSTER: "1"
      AERO_VV_DESELECTED_JSON: vv-deselected.jsonl
      VV_SELECTION: "su2 and vv and slow and not mesh_sweep"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install aero with the su2 + openfoam + provenance + vv extras
        # OpenFOAM stays installed so a future cross-solver compare against
        # `rhoCentralFoam` can run from this workflow without a re-provision.
        run: |
          # Locked install (Stage 23; extends ADR-049 H-15 to the self-hosted V&V jobs): exactly
          # the versions in uv.lock, so a V&V run is evidence about the lock that the release ships.
          uv sync --locked --python 3.12 --extra openfoam --extra su2 --extra provenance --extra vv --extra dev

      - name: Fetch the ONERA M6 mesh (DVC, fail-loud)
        # Exactly the one DVC-tracked file an SU2 test reads (the Cp reference CSVs are in git).
        # Targeted, not quiet, and no `||`: a pull failure fails this step. A bare `dvc pull`
        # can never succeed here, because it also targets the DrivAerML dataset on the
        # aero-nfs remote (ADR-011).
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        run: .venv/bin/dvc pull data/meshes/su2/onera_m6.su2.dvc

      - name: Run the SU2-stack suite
        # A solver failure FAILS its test (Stage 22); only a measured tolerance miss may xfail.
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        run: .venv/bin/pytest -m "$VV_SELECTION" --run-slow -v --junitxml=vv-junit.xml tests/vv

      - name: Summarise what this job measured
        if: always()
        run: >-
          python3 -I scripts/vv_ci_summary.py --title "V&V SU2 stack (frozen-optional)"
          --selection "$VV_SELECTION" --junit vv-junit.xml --deselected vv-deselected.jsonl
          >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the V&V dashboard
        if: always()
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        run: .venv/bin/aero vv report --latest --html docs/vv-dashboard.html

      - name: Upload the V&V dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vv-dashboard-transonic
          path: docs/vv-dashboard.html
