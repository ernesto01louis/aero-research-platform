name: docs-sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  status-block:
    name: README STATUS block consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # regenerate_status.sh deliberately asks git whether the stage tag EXISTS
          # rather than trusting the handoff frontmatter (it renders "(not yet tagged)"
          # when it does not), so this check is only correct if the checkout HAS the
          # tags. actions/checkout fetches none by default, so CI rendered
          # "(not yet tagged)" while any tagged clone rendered the bare tag — the two
          # disagreed and the committed block could never satisfy both.
          #
          # Latent until 2026-10-10: every earlier stage refreshed the README before
          # its tag was pushed, so both sides read "(not yet tagged)" and matched by
          # luck. v0.0.20 had to be tagged FIRST (the generator cannot emit the final
          # line until the tag exists), which exposed it.
          #
          # `fetch-tags: true` alone is NOT enough, and that is worth stating because it
          # looks sufficient: dropping `--no-tags` only makes git FOLLOW tags that point
          # at commits it actually fetched. At the default depth of 1 a run on main's tip
          # fetches that commit alone, while a stage tag points at the commit it was cut
          # from (v0.0.20 -> bc1384a, the parent of 205d542), so the tag is unreachable
          # and never arrives. Full history is what guarantees every tag is present.
          fetch-depth: 0
      - name: Check README STATUS block matches latest handoff
        run: |
          chmod +x scripts/regenerate_status.sh
          scripts/regenerate_status.sh --check
