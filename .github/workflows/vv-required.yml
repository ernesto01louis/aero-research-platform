name: vv-required

# vv-required — the stage-gated, *required* V&V status check on `main`.
#
# A red solver stack in `aero vv report --latest` means no `production` runs on
# that stack (ADR-005, scoped per stack by ADR-051 D2), and a PR that changes a
# solver adapter or the V&V harness must not merge with broken physics. But PRs that touch neither must not be blocked on the V&V cluster
# (guardrail 4). GitHub required checks must always report a result, and a
# skipped job never satisfies one — so this workflow always runs, and a
# `changed-files` filter decides whether the real V&V suite executes:
#
#   * PR touches aero/adapters/** , aero/vv/** , aero/geometry/** , conf/case/** ,
#     pyproject.toml
#       -> run the single-grid V&V suite; the job's result gates the merge.
#   * otherwise
#       -> the suite steps are skipped; the job is trivially green.
#
# The GCI mesh sweep (`mesh_sweep`-marked) is excluded here — it runs nightly
# in `vv-smoke`. The multi-hour moving-mesh cases (`moving`-marked) are also
# excluded: they exceed the 60-min CI budget and run via the driver script
# (`scripts/stage11_moving_vv.py`), not this runner. Promote this to a required
# status check via branch protection.

on:
  pull_request:
    branches: [main]

concurrency:
  # Superseding a required check is safe and desirable: branch protection
  # evaluates the HEAD commit only, so an in-flight run for an older push can
  # never satisfy the gate and is only holding the one runner hostage.
  # Added AFTER scripts/run_long.sh learned to reap on signal/timeout —
  # the order matters. The runner is configured
  # `Force kill process on cancellation: False`, so cancelling a job does
  # NOT stop its step; enabling cancel-in-progress first would have turned
  # every superseded push into a fresh batch of orphaned solver processes.
  group: vv-required-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vv-required:
    name: vv-required — stage-gated V&V
    runs-on: [self-hosted, vv]
    timeout-minutes: 60
    env:
      # Secrets are STEP-scoped (Stage 21, ADR-049 H-08): only the steps that talk to
      # the cluster receive them -- never the install step, which runs third-party
      # build code, and never a third-party action.
      # This job owns the lifetime of every solve it submits: run_long.sh reaps
      # the detached tmux session on cancellation or timeout instead of leaving
      # it running. Without this, the `cancel-in-progress` group above would strand a
      # solve on every superseded push — the runner reports `busy` with no job
      # in flight, and the next run competes with the last one's corpses.
      AERO_RUN_LONG_REAP: "1"
      # Stage 22 (ADR-051): no V&V job is green when it measured nothing. A cluster that is
      # not ready FAILS the suite instead of skipping it; the deselection record feeds the
      # step summary, which says in words what was not measured and why.
      AERO_VV_REQUIRE_CLUSTER: "1"
      AERO_VV_DESELECTED_JSON: vv-deselected.jsonl
      # The active (OpenFOAM) stack only: `su2` is the frozen-optional SU2 stack (ADR-013,
      # ADR-051 D2; vv-transonic dispatch), `unmeasurable` a documented NO-GO whose solve
      # cannot complete (deselected with words, operator decision 2026-10-16).
      VV_SELECTION: "vv and slow and not mesh_sweep and not moving and not su2 and not unmeasurable"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether V&V is relevant to this PR
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            relevant:
              - 'aero/adapters/**'
              - 'aero/vv/**'
              - 'aero/geometry/**'
              - 'conf/case/**'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Install aero
        if: steps.filter.outputs.relevant == 'true'
        run: |
          # Locked install (Stage 23; extends ADR-049 H-15 to the self-hosted V&V jobs): exactly
          # the versions in uv.lock, so a V&V run is evidence about the lock that the release ships.
          uv sync --locked --python 3.12 --extra openfoam --extra provenance --extra vv --extra dev

      - name: Run the stage-gated V&V suite (single-grid)
        if: steps.filter.outputs.relevant == 'true'
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
        run: .venv/bin/pytest -m "$VV_SELECTION" --run-slow -v --junitxml=vv-junit.xml tests/vv

      - name: Summarise what this job measured
        if: always() && steps.filter.outputs.relevant == 'true'
        run: >-
          python3 -I scripts/vv_ci_summary.py --title "vv-required" --selection "$VV_SELECTION"
          --junit vv-junit.xml --deselected vv-deselected.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: V&V not relevant — passing trivially
        if: steps.filter.outputs.relevant != 'true'
        run: |
          echo "PR touches no adapter or V&V code — vv-required passes trivially."
          {
            echo "## vv-required: nothing measured, by design"
            echo ""
            echo "This PR changes no path in the V&V filter (aero/adapters/**, aero/vv/**,"
            echo "aero/geometry/**, conf/case/**, pyproject.toml), so no V&V case was run and this"
            echo "check passes trivially. It is not evidence about any case's physics; the per-case"
            echo "production gate is \`aero vv report --latest\` (ADR-005, scoped by ADR-051 D2)."
          } >> "$GITHUB_STEP_SUMMARY"
