name: joss-draft

# Builds the JOSS paper PDF (paper/paper.md + paper.bib) with the Open Journals toolchain, so the
# rendered paper can be reviewed on every PR that touches it. Not a required check. It never
# submits anything: JOSS submission is the operator's act (docs/release/joss.md). The workflow path
# filter is fine here, because this check is never required.

on:
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/joss-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joss-draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    name: JOSS paper draft (informational)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the draft PDF
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c # v1.0
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joss-paper
          path: paper/paper.pdf
          archive: false
