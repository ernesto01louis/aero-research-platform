name: commit-lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: enforce Conventional Commits on PR title and every commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@19.8.1 \
            @commitlint/config-conventional@19.8.1
      - name: Write commitlint config
        run: |
          cat > commitlint.config.js <<'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              // Format: <type>(stage-NN): <subject>
              'type-enum': [2, 'always', [
                'feat', 'fix', 'chore', 'docs', 'test',
                'refactor', 'ci', 'perf', 'style', 'build'
              ]],
              'scope-empty': [2, 'never'],
              'scope-case': [2, 'always', 'lower-case'],
              'scope-pattern': [2, 'always', /^stage-\d{2}$/],
              'subject-empty': [2, 'never'],
              'subject-full-stop': [2, 'never', '.'],
              'subject-case': [0],   // proper nouns abound (OpenFOAM, NASA, Claude Code, PhysicsNeMo, MLflow); enforcement is impractical
              'header-max-length': [2, 'always', 100],
              'body-max-line-length': [0],   // long URLs and pasted output are common in body
              'footer-max-line-length': [0], // same for footers (Co-Authored-By + long emails, etc.)
            },
            plugins: [
              {
                rules: {
                  'scope-pattern': ({scope}, when, pattern) => {
                    if (!scope) return [false, 'scope must be present'];
                    if (!pattern.test(scope)) {
                      return [false, `scope "${scope}" must match ${pattern}`];
                    }
                    return [true];
                  }
                }
              }
            ]
          };
          EOF
      - name: Validate PR title
        # The title is untrusted input: it reaches the shell only through env, never by
        # ${{ }} interpolation into the script text (GitHub script-injection guidance).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint
      - name: Validate every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
