name: commit-lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    name: enforce Conventional Commits on PR title and every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@19 \
            @commitlint/config-conventional@19
      - name: Write commitlint config
        run: |
          cat > commitlint.config.js <<'EOF'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              // Format: <type>(stage-NN): <subject>
              'type-enum': [2, 'always', [
                'feat', 'fix', 'chore', 'docs', 'test',
                'refactor', 'ci', 'perf', 'style', 'build'
              ]],
              'scope-empty': [2, 'never'],
              'scope-case': [2, 'always', 'lower-case'],
              'scope-pattern': [2, 'always', /^stage-\d{2}$/],
              'subject-empty': [2, 'never'],
              'subject-full-stop': [2, 'never', '.'],
              'subject-case': [0],   // proper nouns abound (OpenFOAM, NASA, Claude Code, PhysicsNeMo, MLflow); enforcement is impractical
              'header-max-length': [2, 'always', 100],
              'body-max-line-length': [0],   // long URLs and pasted output are common in body
              'footer-max-line-length': [0], // same for footers (Co-Authored-By + long emails, etc.)
            },
            // EXACTLY ONE exemption, by full-header equality — never a prefix or a wildcard.
            //
            // Stage 20, commit 0b6d774: its header is 101 chars against the 100 limit. It cannot
            // be reworded. 0b6d774 is the PARENT of f4279f2, and f4279f2 is the
            // `provenance.git_sha` recorded inside BOTH failed R3 restart runs on NFS
            // (hg2007_flexible_foil-20260916-152606 and -20260916-213116) — the decisive evidence
            // for Stage 20's recorded NO-GO on infrastructure (ADR-041 "V7 — FIRED"; handoff
            // §6.88-§6.89). Rewriting that commit changes f4279f2's SHA and orphans the pointer
            // the evidence cites, so the header is left as-is and exempted here instead.
            //
            // The match is on the WHOLE header string, so no other long header is ever excused:
            // the limit stays [2, 'always', 100] for every commit but this one. Remove this entry
            // if that commit ever leaves the history (e.g. after the branch is squash-merged and
            // an annotated evidence tag keeps the SHAs resolvable).
            ignores: [
              (message) =>
                message.split('\n')[0] ===
                'docs(stage-20): ADR-045 C8 -- R3 treatment segment 1 submitted (hg2007_flexible_foil-20260916-152606)',
            ],
            plugins: [
              {
                rules: {
                  'scope-pattern': ({scope}, when, pattern) => {
                    if (!scope) return [false, 'scope must be present'];
                    if (!pattern.test(scope)) {
                      return [false, `scope "${scope}" must match ${pattern}`];
                    }
                    return [true];
                  }
                }
              }
            ]
          };
          EOF
      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint
      - name: Validate every commit in the PR
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to   "${{ github.event.pull_request.head.sha }}" \
            --verbose
