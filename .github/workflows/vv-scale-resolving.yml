name: vv-scale-resolving

# V&V scale-resolving — runs the Stage-07 high-order scale-resolving cases
# (Taylor-Green vortex and periodic-hill LES) through PyFR + NekRS. Nightly
# only — never on push/PR. The benchmark cases require a GPU runner, so this
# workflow is gated on the `gpu` self-hosted runner label; if no such runner
# is online the job skips with an informative message (the platform has no
# discrete GPU on-prem, so this CI path is operator-provisioned per Stage 13).
#
# This is the cost-cap-respecting CI ceiling: every run inside this workflow
# uses the local-SSH executor against `aero-build` if a GPU is colocated, OR
# the RunPod executor against the $50/month cap (CONSTITUTION Invariant 8).
# Stage 13's multi-cloud cost router supersedes this gate.
#
# See ADR-007 for the full design + rationale.

# Stage 21 (ADR-049 H-19): the schedules are removed. No [self-hosted, gpu] runner
# exists, so every scheduled run skipped both GPU jobs and reported a green that
# verified nothing. The workflow is now dispatch-only and FAILS LOUDLY when no GPU
# runner is registered. Restore a schedule only together with a real GPU runner.
on:
  workflow_dispatch:

concurrency:
  group: vv-scale-resolving
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-gpu-runner:
    name: detect a GPU runner
    runs-on: ubuntu-24.04
    outputs:
      have_gpu: ${{ steps.check.outputs.have_gpu }}
    steps:
      - id: check
        # Stage 07 has no discrete GPU on-prem (Proxmox host is iGPU only) so
        # the gpu label is operator-provisioned at Stage 13. Until that lands,
        # this workflow runs only when an operator manually labels a runner
        # `[self-hosted, gpu]`.
        run: |
          echo "Stage 07 has no on-prem discrete GPU; vv-scale-resolving runs"
          echo "only when an operator has labelled a self-hosted runner 'gpu'."
          # Default to skip; the downstream job is gated by this output.
          echo "have_gpu=false" >> "$GITHUB_OUTPUT"
          {
            echo "## vv-scale-resolving: nothing measured, and this job FAILS"
            echo ""
            echo "No [self-hosted, gpu] runner is registered (ADR-007), a resource absent by design."
            echo "taylor_green_p3_32 and periodic_hill_2d (the PyFR stack, frozen-optional, ADR-013)"
            echo "were not measured; the report shows them as frozen (ADR-051 D2). The job fails"
            echo "rather than report a vacuous green (ADR-049 H-19)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::no [self-hosted, gpu] runner is registered -- vv-scale-resolving cannot run, so it fails instead of reporting a vacuous green"
          exit 1

  vv-scale-resolving:
    name: V&V scale-resolving — PyFR + NekRS
    needs: detect-gpu-runner
    if: needs.detect-gpu-runner.outputs.have_gpu == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 240
    env:
      AERO_RUNPOD_MONTHLY_CAP_USD: "50"
      AERO_RUN_LONG_REAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install aero with pyfr + nekrs + provenance + vv extras
        run: |
          # Locked install (Stage 23; extends ADR-049 H-15 to the self-hosted V&V jobs): exactly
          # the versions in uv.lock, so a V&V run is evidence about the lock that the release ships.
          uv sync --locked --python 3.12 --extra pyfr --extra nekrs --extra provenance --extra vv --extra dev

      # Stage 22: the `dvc pull --quiet || echo "dvc pull skipped"` step that stood here is gone.
      # No scale-resolving case reads a DVC-tracked file, and a bare pull cannot succeed in this
      # repository (it also targets the DrivAerML dataset on the aero-nfs remote).

      - name: Run the scale-resolving suite
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        # Tests are stage_07-marked + slow; the host fixtures `vv_cluster_ready_pyfr`
        # / `vv_cluster_ready_nekrs` gate execution on SIF + DSN + scipy.
        # NOTE (Stage 22 audit): these two test files have never existed in git, so if a GPU
        # runner were registered this step would fail on "file not found" (loudly, not green).
        # The PyFR stack is frozen-optional (ADR-013); writing its tests is not Stage 22's work.
        run: |
          .venv/bin/pytest -m "stage_07 and vv and slow" --run-slow -v \
              tests/vv/test_taylor_green_pyfr.py \
              tests/vv/test_taylor_green_nekrs.py

      - name: Regenerate the V&V dashboard
        if: always()
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        run: .venv/bin/aero vv report --latest --html docs/vv-dashboard.html

      - name: Cost-cap audit (post-run)
        if: always()
        # Surface the cost ledger so any RunPod spend in this workflow is
        # visible in the workflow log. CONSTITUTION Invariant 8.
        run: .venv/bin/aero cost show

      - name: Upload the V&V dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vv-dashboard-scale-resolving
          path: docs/vv-dashboard.html

  surrogate-inference-smoke:
    name: surrogate inference smoke — DoMINO (Stage 09)
    needs: detect-gpu-runner
    # Weekly (Mon) / manual dispatch; gated on a GPU runner + the trained
    # checkpoint. Catches model + file-format degradation between trainings
    # (CONSTITUTION Invariant 9). Non-required, like the scale-resolving job.
    if: needs.detect-gpu-runner.outputs.have_gpu == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    env:
      AERO_RUN_LONG_REAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install aero with physicsnemo + provenance + vv extras
        run: |
          # Locked install (Stage 23; extends ADR-049 H-15 to the self-hosted V&V jobs): exactly
          # the versions in uv.lock, so a V&V run is evidence about the lock that the release ships.
          uv sync --locked --python 3.12 --extra physicsnemo-cu12 --extra provenance --extra vv --extra dev

      - name: DoMINO inference smoke + surrogate V&V cross-check
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        # Loads the latest DoMINO checkpoint and predicts a held-out DrivAerML
        # case inside physicsnemo.sif; the on-pod path writes the surrogate_vv
        # report, which `aero vv surrogate --report` renders + asserts here.
        # Stage 22: an explicit guard instead of `|| echo`, so a failing cross-check fails the
        # step. A missing report is a resource absent by design (DoMINO training was cancelled,
        # ADR-013) and is said so in the step summary; it is never a pass.
        run: |
          if [ ! -f docs/surrogate_vv-latest.json ]; then
            echo "## DoMINO inference smoke: nothing measured" >> "$GITHUB_STEP_SUMMARY"
            echo "No saved surrogate_vv report exists (DoMINO training cancelled, ADR-013)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          .venv/bin/aero vv surrogate domino --report docs/surrogate_vv-latest.json

      - name: Upload the surrogate_vv report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surrogate-vv-domino
          path: docs/surrogate_vv-latest.json
          if-no-files-found: ignore
