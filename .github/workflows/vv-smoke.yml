name: vv-smoke

# V&V smoke — runs the NASA TMR verification suite (flat plate, 2D bump,
# NACA 0012) through the V&V harness on a self-hosted runner labelled `vv`
# (registered on aero-build). A GitHub-hosted runner cannot reach the private
# aero cluster, the OpenFOAM SIF, the MLflow server, or the aero_provenance
# Postgres DB, so this job must run self-hosted. See ADR-005.
#
# On push / PR it runs the single-grid V&V suite; the nightly schedule also
# runs the GCI mesh sweeps (`mesh_sweep`-marked tests). After the suite it
# regenerates docs/vv-dashboard.html and posts the latest V&V status as a PR
# comment.
#
# Note: not a required status check — a self-hosted runner that is offline
# must not block PRs. The required, stage-gated check is `vv-required`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"

concurrency:
  # A superseded push has nothing to contribute: the suite is a snapshot of
  # a commit, and on a single self-hosted runner an obsolete run is pure
  # contention against the required check.
  # Added AFTER scripts/run_long.sh learned to reap on signal/timeout —
  # the order matters. The runner is configured
  # `Force kill process on cancellation: False`, so cancelling a job does
  # NOT stop its step; enabling cancel-in-progress first would have turned
  # every superseded push into a fresh batch of orphaned solver processes.
  group: vv-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  vv-smoke:
    name: V&V smoke — NASA TMR suite
    # Fork guard (Stage 21, ADR-049 H-11): this PUBLIC repo's self-hosted runners reach
    # the cluster, so a pull request from a fork never runs here. The primary control is
    # the repo setting "require approval for all external contributors" (operator).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vv]
    timeout-minutes: 90
    env:
      # Secrets are STEP-scoped (Stage 21, ADR-049 H-08): only the steps that talk to
      # the cluster receive them -- never the install step, which runs third-party
      # build code, and never a third-party action.
      # This job owns the lifetime of every solve it submits: run_long.sh reaps
      # the detached tmux session on cancellation or timeout instead of leaving
      # it running. Without this, the `cancel-in-progress` group above would strand a
      # solve on every superseded push — the runner reports `busy` with no job
      # in flight, and the next run competes with the last one's corpses.
      AERO_RUN_LONG_REAP: "1"
      # Stage 22 (ADR-051): a cluster that is not ready FAILS the suite instead of skipping it
      # green, and the deselection record feeds the step summary.
      AERO_VV_REQUIRE_CLUSTER: "1"
      AERO_VV_DESELECTED_JSON: vv-deselected.jsonl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install aero with the openfoam + provenance + vv extras
        # Stage 22: the SU2 tests are `su2`-marked and deselected here (the frozen-optional SU2
        # stack, ADR-013 / ADR-051 D2; measured by the vv-transonic dispatch), so the su2 extra
        # and the DVC pull went with them. No selected test reads a DVC-tracked file. The pull
        # that used to run here was `dvc pull --quiet || echo "dvc pull skipped (no remote
        # configured)"`: it failed on every run (a bare pull also targets the DrivAerML dataset,
        # which lives on the aero-nfs remote) and the echo relabelled that as a skip.
        run: |
          # Locked install (Stage 23; extends ADR-049 H-15 to the self-hosted V&V jobs): exactly
          # the versions in uv.lock, so a V&V run is evidence about the lock that the release ships.
          uv sync --locked --python 3.12 --extra openfoam --extra provenance --extra vv --extra dev

      - name: Choose the selection
        # The ACTIVE (OpenFOAM) stack only. `su2` = the frozen-optional SU2 stack; `unmeasurable`
        # = a documented NO-GO whose solve cannot complete, deselected with words (operator
        # decision 2026-10-16). The nightly adds the GCI mesh sweeps.
        run: |
          base="vv and slow and not moving and not su2 and not unmeasurable"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "VV_SELECTION=$base" >> "$GITHUB_ENV"
          else
            echo "VV_SELECTION=$base and not mesh_sweep" >> "$GITHUB_ENV"
          fi

      - name: Run the V&V suite (single-grid on push/PR, + GCI sweep nightly)
        # Stage 06: the test selector now picks up both stage_05 (OpenFOAM)
        # and stage_06 (SU2) TMR paths via the `vv` + `slow` markers they
        # share.
        #
        # `not moving` (Stage 19) — restores a suite that had been broken for 23
        # days. Commit 9e6e930 (Stage 11) introduced the `moving` marker for the
        # multi-hour moving-mesh cases, documented it in pyproject.toml as "runs
        # via the driver", added scripts/stage11_moving_vv.py to run them, and
        # added `and not moving` to vv-required.yml — but not here. From that
        # commit's own push (run #140, 2026-07-05T15:28:22Z) this job never
        # finished again: 73 consecutive runs, 48 of them killed at exactly
        # 90m00s by the ceiling below. The last green run was #137 at 41m07s.
        # The two moving cases alone consume more than half the budget, and
        # test_unsteady_plunging_airfoil has never once completed in CI.
        # They are gated by moving-vv.yml instead, which gives them hours.
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        run: .venv/bin/pytest -m "$VV_SELECTION" --run-slow -v --junitxml=vv-junit.xml tests/vv

      - name: Summarise what this job measured
        if: always()
        run: >-
          python3 -I scripts/vv_ci_summary.py --title "V&V smoke" --selection "$VV_SELECTION"
          --junit vv-junit.xml --deselected vv-deselected.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the V&V dashboard
        if: always()
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        run: .venv/bin/aero vv report --latest --html docs/vv-dashboard.html

      - name: Upload the V&V dashboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vv-dashboard
          path: docs/vv-dashboard.html

      - name: Capture the V&V status as JSON
        if: always() && github.event_name == 'pull_request'
        env:
          AERO_PROVENANCE_DSN: ${{ secrets.AERO_PROVENANCE_DSN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AERO_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AERO_DVC_SECRET_ACCESS_KEY }}
        # No `|| echo "[]"` (Stage 22): a failed report fails this step, and the comment below says
        # so, instead of reading as "no V&V runs found".
        run: .venv/bin/aero vv report --latest --json > vv-status.json

      - name: Post the V&V status as a PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let rows = null;
            try { rows = JSON.parse(fs.readFileSync('vv-status.json', 'utf8')); } catch (e) {}
            let body = '## V&V status — newest run per registered case (ADR-051 D2: per stack)\n\n';
            if (rows === null) {
              body += '_The V&V report FAILED; see the "Capture the V&V status as JSON" step._';
            } else if (rows.length === 0) {
              body += '_The report returned no rows._';
            } else {
              const marks = { pass: '🟢', frozen: '🧊', deferred: '⏸️' };
              body += '| Stack | Case | Status | Metric errors |\n|---|---|---|---|\n';
              for (const r of rows) {
                const mark = marks[r.status] || '🔴';
                const errs = Object.entries(r.metric_errors || {})
                  .map(([k, v]) => `${k} ${(v * 100).toFixed(2)}%`).join(', ') || '—';
                body += `| ${r.stack || '?'} | ${r.case} | ${mark} ${r.status} | ${errs} |\n`;
              }
              body += '\nA production-tagged run is gated by its own stack (ADR-005, scoped by ADR-051 D2).\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
