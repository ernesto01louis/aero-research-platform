name: secret-scan

# gitleaks over the commits a pull request or push adds (Stage 21, ADR-049 H-22).
#
# Not a required check. The pre-commit gitleaks hook only scans staged changes on the
# author's machine; this scans what actually reaches GitHub, including commits made
# without the hook. Only the commits being added are scanned (never the full history),
# so a finding always belongs to the change under review. The binary is the pinned
# release tarball, verified against its published sha256 before use; --redact keeps any
# finding's secret value out of the log.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (added commits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (sha256-verified)
        run: |
          set -euo pipefail
          tgz=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the added commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER~1..$PUSH_AFTER"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
