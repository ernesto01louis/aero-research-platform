name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
      - name: Install dev extras
        # Locked install (Stage 21, ADR-049 H-15): CI tests exactly the versions in uv.lock
        # (the licence scan and the release are built from the same lock) instead of
        # re-resolving fresh on every run. .venv/bin goes first on PATH for later steps.
        run: |
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
