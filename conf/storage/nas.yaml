# Stage 09 (ADR-011) — on-prem NAS DVC remote profile.
#
# MinIO (the `aero-minio` app) on the dedicated bare-metal NAS, nas.lan / 192.168.2.60.
# The migration gave the NAS a new identity instead of the re-IP to 192.168.2.100 that
# docs/runbooks/stage-09-nas-parallel-cutover.md planned (corrected 2026-10-22, Stage 23:
# 192.168.2.100:9000 no longer answers). Running MinIO/S3 natively on
# ZFS sidesteps the NFS-atomicity/root-squash reason ADR-004 kept MinIO off NFS.
# Switch the default to this (conf/config.yaml `- storage: nas`) once the NAS is
# live; flipping cloud->NAS is config + Vault creds only, zero code change.

dvc_remote: aero-nas
s3_endpoint: http://192.168.2.60:9000
bucket: aero-dvc
